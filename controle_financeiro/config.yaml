# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Controle Financeiro
version: "0.4.12"
slug: controle_financeiro
description: Controle financeiro pessoal — contas fixas, cartão, parcelados e dívidas.
url: "https://github.com/diogocaseca/controle-financeiro"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-multiple
panel_title: Finanças
options:
  exigir_login: false
schema:
  exigir_login: bool
# Acesso direto fora do HA (desativado por padrão; habilite na aba Rede do app).
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Interface web (acesso direto, sem passar pelo Home Assistant)
